# ==============================================================================
# プロジェクト設定ファイル
# ==============================================================================
# このファイルはステアリングルール全体の「唯一の真実の情報源」です。
# カバレッジ目標、ブランチ名、バージョンなどの数値・設定はここで一元管理します。
# 各ルールファイルはこのファイルの値を参照してください。
#
# 企業利用時: このファイルをプロジェクトごとにカスタマイズすることで、
# 同じルール体系を異なるプロジェクトに適用できます。
# ==============================================================================

project:
  name: "Komon"
  type: "cli-tool"                    # cli-tool | library | web-app | api-server
  language: "python"
  description: "軽量なシステム監視・アドバイザーツール"

environment:
  platform: "AlmaLinux 9"
  platform_type: "RHEL"               # RHEL | Debian | macOS | Windows
  shell: "bash"
  package_manager: "dnf/yum"
  python_version: "3.10+"

communication:
  user_language: "ja"                  # ユーザーとの会話言語
  code_language: "en"                  # コード内の言語
  commit_language: "ja"                # コミットメッセージの言語
  use_emoji: true

versioning:
  scheme: "semver"
  initial_version: "1.0.0"
  current_version: "1.27.0"
  # バージョン情報を管理するファイル一覧（リリース時に全て同期が必要）
  version_files:
    - path: "version.txt"
      format: "plain"                  # ファイル全体がバージョン番号
    - path: "src/komon/__init__.py"
      format: "python-dunder"          # __version__ = "X.X.X"
    - path: "docs/CHANGELOG.md"
      format: "changelog"              # [Unreleased] → [X.X.X] - YYYY-MM-DD
    - path: ".kiro/steering/project-config.yml"
      format: "yaml-field"             # current_version フィールド

testing:
  framework: "pytest"
  coverage_target: 95                  # プロジェクト全体の目標（%）
  coverage_minimum: 90                 # 最低許容値（%）
  coverage_core_modules: 98            # コアモジュールの目標（%）
  property_testing: true
  property_framework: "hypothesis"
  test_command: "python -m pytest tests/ -v"
  coverage_command: "bash run_coverage.sh"

quality:
  # push前に実行する品質チェックスクリプト
  pre_push_checks:
    - "python scripts/check_status_consistency.py"
  # Spec検証スクリプト
  spec_validation:
    - "python scripts/validate_specs.py"
    - "python scripts/check_spec_consistency.py"
  # コードフォーマット・リント（将来用）
  # formatters:
  #   - "black src/ tests/"
  #   - "flake8 src/ tests/"
  #   - "mypy src/"

git:
  main_branch: "main"
  branch_prefix:
    feature: "feature/task-"
    bugfix: "bugfix/"
    refactor: "refactor/"
  # Git認証情報（プレースホルダー。実際の値は各開発者が設定）
  user:
    name: "<GIT_USER_NAME>"
    email: "<GIT_USER_EMAIL>"
    github_account: "<GITHUB_ACCOUNT>"

spec:
  location: ".kiro/specs/"
  format: "yaml"                       # yaml | markdown
  required_files:
    - "requirements.yml"
    - "design.yml"
    - "tasks.yml"

changelog:
  location: "docs/CHANGELOG.md"
  format: "keep-a-changelog"

tasks:
  location: ".kiro/tasks/"
  active_file: "implementation-tasks.md"
  archive_file: "completed-tasks.md"

# ==============================================================================
# プロジェクト固有のバージョニング境界ケース
# ==============================================================================
# 判断に迷うケースを事前に定義しておくことで、
# 誰がKiroを操作しても同じバージョニング判断になる。
# ==============================================================================
versioning_boundary_cases:
  - change: "表示件数のデフォルト変更"
    version: "PATCH"
    reason: "ユーザー体験の小改善、オプションで従来の動作も可能"
  - change: "新しいオプション追加（`--history N`）"
    version: "MINOR"
    reason: "機能拡張（既存動作は変わらない）"
  - change: "既存オプションの削除"
    version: "MAJOR"
    reason: "破壊的変更"
  - change: "既存オプションの非推奨化（deprecation）"
    version: "MINOR"
    reason: "まだ動作する、警告を表示"
  - change: "内部リファクタリング"
    version: "PATCH"
    reason: "ユーザーには見えない"
  - change: "テストの追加のみ"
    version: "なし"
    reason: "開発者向け改善"
  - change: "CI/CDの導入"
    version: "なし"
    reason: "開発者向け改善"
  - change: "README.mdの大幅な改善"
    version: "PATCH"
    reason: "ドキュメント修正"
  - change: "エラーメッセージの改善"
    version: "PATCH"
    reason: "ユーザー体験の改善"
  - change: "パフォーマンス改善（2倍高速化）"
    version: "PATCH"
    reason: "機能追加ではない"
  - change: "新しい依存パッケージの追加"
    version: "MINOR"
    reason: "環境への影響がある"
  - change: "依存パッケージの削除"
    version: "MAJOR"
    reason: "破壊的変更の可能性"
